name: CI & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/ict-mcp

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: react
            context: .
            dockerfile: Dockerfile
            build_args: |
              REACT_APP_MCP_CONNECTOR_URL=http://oc1.rahuldhiman.com:3002
              REACT_APP_CHART_SERVER_URL=http://oc2.rahuldhiman.com:3000
          - service: connector
            context: backend/connector
            dockerfile: backend/connector/Dockerfile
            build_args: ""
          - service: charts
            context: backend/charts
            dockerfile: backend/charts/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: production
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - host: oc1
            ip: 80.225.200.246
          - host: oc2
            ip: 137.23.53.253
    steps:
      - name: Deploy to ${{ matrix.host }} over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_IP: ${{ matrix.ip }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null

          # The server's authorized_keys entry for this key forces the
          # actual deploy command (docker compose pull && up -d) and
          # captures whatever we "run" here into $SSH_ORIGINAL_COMMAND
          # to use as the image tag — this key can't run anything else
          # even if the command below is tampered with.
          ssh -i ~/.ssh/deploy_key "ubuntu@$SERVER_IP" "${{ github.sha }}"
