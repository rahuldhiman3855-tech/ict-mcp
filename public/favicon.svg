<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon Depth -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Gear Metallic Gradient -->
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Shield Glow & Base Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Trend Line Gradient -->
    <linearGradient id="trendGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Container / Background for Header & Favicon contrast -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Main Group with Drop Shadow -->
  <g filter="url(#shadow)">
    
    <!-- MECHANICAL GEAR (Cron / Automation Engine) -->
    <g fill="url(#gearGrad)" stroke="#1E293B" stroke-width="6">
      <path d="M256 64l18 36h40l24-30 32 24-12 40 28 28 40-12 24 32-30 24v40l36 18v40l-36 18v40l30 24-24 32-40-12-28 28 12 40-32 24-24-30h-40l-18 36h-40l-18-36h-40l-24 30-32-24 12-40-28-28-40 12-24-32 30-24v-40l-36-18v-40l36-18v-40l-30-24 24-32 40 12 28-28-12-40 32-24 24 30h40l18-36h40z"/>
    </g>

    <!-- Inner Core Background -->
    <circle cx="256" cy="256" r="144" fill="#0F172A" stroke="#38BDF8" stroke-width="8"/>

    <!-- SECURITY SHIELD (Cron Manager Safety & Reliability) -->
    <path d="M256 140c56 0 100-20 100-20v70c0 70-45 110-100 136-55-26-100-66-100-136v-70s44 20 100 20z" fill="url(#shieldGrad)" stroke="#60A5FA" stroke-width="4"/>

    <!-- TRADING CANDLESTICKS (Algorithm Charts) -->
    <!-- Candle 1 -->
    <line x1="210" y1="200" x2="210" y2="270" stroke="#93C5FD" stroke-width="4" stroke-linecap="round"/>
    <rect x="200" y="215" width="20" height="35" rx="4" fill="#34D399"/>

    <!-- Candle 2 (Divergence / Main) -->
    <line x1="256" y1="175" x2="256" y2="285" stroke="#93C5FD" stroke-width="4" stroke-linecap="round"/>
    <rect x="246" y="195" width="20" height="60" rx="4" fill="#60A5FA"/>

    <!-- Candle 3 -->
    <line x1="302" y1="220" x2="302" y2="290" stroke="#93C5FD" stroke-width="4" stroke-linecap="round"/>
    <rect x="292" y="230" width="20" height="40" rx="4" fill="#34D399"/>

    <!-- AUTOMATED TRADING TREND LINE (Green Profit Arrow Overlay) -->
    <path d="M 180 290 L 230 240 L 275 270 L 340 170" fill="none" stroke="url(#trendGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Trend Arrowhead -->
    <path d="M 320 168 L 343 168 L 343 191" fill="none" stroke="#34D399" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
