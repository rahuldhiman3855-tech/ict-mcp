services:

  # ==========================================================
  # MYSQL
  # ==========================================================

  mysql:
    image: mysql:8
    container_name: ict-cron-mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-defaultdb}
      MYSQL_USER: ${DB_USER:-avnadmin}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}

    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - backend


  # ==========================================================
  # CONNECTOR
  # ==========================================================

  connector:
    image: ghcr.io/rahuldhiman3855-tech/ict-mcp-connector:${IMAGE_TAG:-latest}
    container_name: ict-cron-connector

    ports:
      - "3002:3002"

    environment:
      NODE_ENV: production
      PORT: 3002

      CHART_SERVER_URL: http://10.0.0.79:3000

      COHERE_API_KEY: ${COHERE_API_KEY:?set COHERE_API_KEY in .env}
      COHERE_MODEL: ${COHERE_MODEL:-command-a-03-2025}
      COHERE_VISION_MODEL: ${COHERE_VISION_MODEL:-command-a-vision-07-2025}
      COHERE_RPM_LIMIT: ${COHERE_RPM_LIMIT:-20}

      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
      GEMINI_API_KEY_2: ${GEMINI_API_KEY_2:-}
      GEMINI_API_KEY_3: ${GEMINI_API_KEY_3:-}
      GEMINI_API_KEY_4: ${GEMINI_API_KEY_4:-}
      GEMINI_API_KEY_5: ${GEMINI_API_KEY_5:-}
      GEMINI_API_KEY_6: ${GEMINI_API_KEY_6:-}
      GEMINI_API_KEY_7: ${GEMINI_API_KEY_7:-}
      GEMINI_API_KEY_8: ${GEMINI_API_KEY_8:-}
      GEMINI_API_KEY_9: ${GEMINI_API_KEY_9:-}
      GEMINI_API_KEY_10: ${GEMINI_API_KEY_10:-}
      GEMINI_API_KEY_11: ${GEMINI_API_KEY_11:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_MODEL_FALLBACK: ${GEMINI_MODEL_FALLBACK:-gemini-3.5-flash-lite}
      GEMINI_MODEL_FALLBACK_LITE: ${GEMINI_MODEL_FALLBACK_LITE:-gemini-3.1-pro-preview}
      GEMINI_RPM_LIMIT: ${GEMINI_RPM_LIMIT:-20}

      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}

      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:?set DB_NAME in .env}

      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}

    volumes:
      - connector-data:/app/data

    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - backend


# ============================================================
# VOLUMES
# ============================================================

volumes:
  mysql-data:
    name: ict-mysql-data

  connector-data:
    name: ict-connector-data


# ============================================================
# NETWORK
# ============================================================

networks:
  backend:
    name: ict-backend
    driver: bridge
